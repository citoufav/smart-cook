name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # self-check scripts import .ts files directly and rely on Node's type stripping
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run check
